{{- range $index, $cluster := .Values.clusters }}
{{- if gt $index 0 }}
---
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .name }}
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: {{ .repoURL }}
        revision: {{ .targetRevision }}
        directories:
          - path: '*'
  template:
    metadata:
      name: '{{ .name }}-{{ "{{.path.basename}}" }}'
    spec:
      project: {{ .project }}
      source:
        repoURL: {{ .repoURL }}
        targetRevision: {{ .targetRevision }}
        path: '{{ "{{.path.path}}" }}'
        directory:
          recurse: true
          exclude: ".*"
      destination:
        name: {{ .destination }}
      syncPolicy: {}
{{- end }}

